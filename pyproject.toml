[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "connectcoin-p2c-tools"
version = "0.1.0"
description = "Independent tooling for ConnectCoin pay-to-connect proofs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "The ConnectCoin developers"}]
dependencies = ["cryptography==47.0.0"]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
p2c-tools = "connectcoin_p2c_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/connectcoin_p2c_tools"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["connectcoin_p2c_tools"]
